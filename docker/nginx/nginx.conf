events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream - Load Balancing between Laravel app containers
    upstream laravel_cluster {
        least_conn;  # Use least connections algorithm
        server app-1:9000 weight=1;
        server app-2:9000 weight=1;
    }

    # Logging with upstream server info
    log_format upstream_log '$remote_addr - [$time_local] "$request" $status '
                            'upstream: $upstream_addr response_time: $upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;
        index index.php;

        # Add header to identify which server handled request (debugging)
        add_header X-Served-By $upstream_addr always;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static files - served directly by Nginx (fast!)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # PHP files - send to PHP-FPM cluster
        location ~ \.php$ {
            fastcgi_pass laravel_cluster;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            # Timeouts for long requests
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_connect_timeout 60;
            
            # Buffer settings
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
