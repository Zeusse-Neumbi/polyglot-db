global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MariaDB metrics
  - job_name: 'mariadb'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          database: 'mariadb'
          role: 'primary'

  # MongoDB metrics
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          database: 'mongodb'
          role: 'replica-set'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'

  # Docker Containers (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Host System (Node Exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
